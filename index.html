<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介ページ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }
        h2 {
            color: #34495e;
            font-size: 1.2rem;
            margin-top: 20px;
        }
        ul {
            padding-left: 20px;
        }
        .links {
            margin-top: 20px;
        }
        .link-button {
            display: inline-block;
            margin: 5px 10px 5px 0;
            padding: 10px 20px;
            background-color: #24292e;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
        .link-button:hover {
            background-color: #444c56;
        }
        .twitter-btn {
            background-color: #1da1f2;
        }
        .twitter-btn:hover {
            background-color: #0c85d0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>かいくん</h1>
        
        <h2>自己紹介</h2>
        <p>情報系技術の学習やプログラミング、デジタル創作などを楽しんでいます。日々の学習のアウトプットや制作物を公開していきます。</p>
        
        <h2>趣味や好きなこと</h2>
        <ul>
            <li>VRChatなどのバーチャル空間での交流や探索</li>
            <li>3Dアバターのカスタマイズやテクスチャ・シェーダーの調整</li>
            <li>プログラミングやWeb開発、ネットワーク技術の学習</li>
        </ul>

        <h2>プレイしているゲーム</h2>
        <ul>
            <li>VRChat</li>
            <li>ファイナルファンタジーXIV (FF14)</li>
            <li>League of Legends (LoL)</li>
        </ul>
        
        <h2>リンク</h2>
        <div class="links">
            <!-- X (Twitter) の URL の「あなたのユーザー名」の部分を書き換えてください -->
            <a class="link-button twitter-btn" href="https://twitter.com/あなたのユーザー名" target="_blank" rel="noopener noreferrer">X (Twitter)</a>
            <a class="link-button" href="https://github.com/it008githabu" target="_blank" rel="noopener noreferrer">GitHubプロフィール</a>
        </div>
    </div>

</body>
</html>
